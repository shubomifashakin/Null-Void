services:
  postgres:
    image: postgres:latest
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: "container={{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m
    security_opt:
      - no-new-privileges:true
    container_name: null-void-postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - system_wide_network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres-123
      POSTGRES_DB: null-void-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  null-void-1:
    image: 545plea/null-void-server:latest
    container_name: null-void-1
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: "container={{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m
        loki-pipeline-stages: |
          - json:
              expressions:
                level: level_label
                timestamp: timestamp
                message: message
                environment: environment
                service: service
          - labels:
              level:
              service:
              environment:
          - timestamp:
              source: timestamp
              format: "2006-01-02T15:04:05.000Z"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
    networks:
      - system_wide_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    env_file:
      - .env.server

  null-void-2:
    image: 545plea/null-void-server:latest
    container_name: null-void-2
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: "container={{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m
        loki-pipeline-stages: |
          - json:
              expressions:
                level: level_label
                timestamp: timestamp
                message: message
                environment: environment
                service: service
          - labels:
              level:
              service:
              environment:
          - timestamp:
              source: timestamp
              format: "2006-01-02T15:04:05.000Z"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
    networks:
      - system_wide_network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    env_file:
      - .env.server

  null-void-queue-processor:
    image: 545plea/null-void-processor:latest
    container_name: null-void-queue-processor
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: "container={{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m
        loki-pipeline-stages: |
          - json:
              expressions:
                level: level_label
                timestamp: timestamp
                message: message
                environment: environment
                service: service
          - labels:
              level:
              service:
              environment:
          - timestamp:
              source: timestamp
              format: "2006-01-02T15:04:05.000Z"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
    networks:
      - system_wide_network
    env_file:
      - .env.processor

  cache-redis:
    image: redis:8.4
    container_name: null-void-cache-redis
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: "container={{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m
    security_opt:
      - no-new-privileges:true
    networks:
      - system_wide_network
    volumes:
      - cache_redis_data:/data
      - "./cache-redis.conf:/etc/redis/redis.conf"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

  queue-redis:
    image: redis:8.4
    container_name: null-void-queue-redis
    logging:
      driver: loki
      options:
        loki-url: "http://loki:3100/loki/api/v1/push"
        loki-external-labels: "container={{.Name}}"
        mode: non-blocking
        max-buffer-size: 4m
    security_opt:
      - no-new-privileges:true
    networks:
      - system_wide_network
    volumes:
      - queue_redis_data:/data
      - "./queue-redis.conf:/etc/redis/redis.conf"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped

networks:
  system_wide_network:
    external: true
    name: system_wide_network

volumes:
  cache_redis_data:
  queue_redis_data:
  postgres_data:
