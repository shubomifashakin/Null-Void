name: Trivy Image Scan

on:
  workflow_dispatch:
  push:
    branches:
      - dev # adjust to whichever branch triggers your image build/push
  schedule:
    - cron: "0 0 * * 5" # Run on Fridays

permissions:
  security-events: write
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          push: false
          load: true # load into local daemon so Trivy can scan it
          tags: ${{ vars.DOCKERHUB_USERNAME }}/your-image:${{ github.sha }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/your-image:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/your-image:buildcache,mode=max,push=true

      - name: Run Trivy image scanner (SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ vars.DOCKERHUB_USERNAME }}/your-image:${{ github.sha }}"
          scan-type: "image"
          ignore-unfixed: true
          format: "sarif"
          output: "trivy-image-results.sarif"
          exit-code: "0"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"

      - name: Upload to security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-image-results.sarif"
          category: "trivy-image"

      - name: Run Trivy (enforce failure threshold, gates registry push)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ vars.DOCKERHUB_USERNAME }}/your-image:${{ github.sha }}"
          scan-type: "image"
          ignore-unfixed: true
          format: "table"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      # Scan passed — push to registry.
      # Replace `your-image` with your actual image name throughout this file.
      # - name: Push to Docker Hub
      #   uses: docker/build-push-action@v6.18.0
      #   with:
      #     context: .
      #     push: true
      #     tags: ${{ vars.DOCKERHUB_USERNAME }}/your-image:${{ github.sha }},${{ vars.DOCKERHUB_USERNAME }}/your-image:latest
      #     cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/your-image:buildcache
      #     cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/your-image:buildcache,mode=max,push=true

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [build-scan-push]
    if: always()
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.build-scan-push.result != 'failure' && 'success' || 'failure' }}
          title: "Trivy Image Scan"
          description: |
            **Commit:** ${{ github.event.head_commit.message || 'Nightly Run' }}
            **Triggered by:** ${{ github.actor }}
            **Branch:** ${{ github.ref_name }}
            **Repository:** ${{ github.repository }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
