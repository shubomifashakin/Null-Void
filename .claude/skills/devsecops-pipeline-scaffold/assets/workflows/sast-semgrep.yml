name: Semgrep

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  schedule:
    - cron: "0 0 * * 5" # Run on Fridays

permissions:
  security-events: write
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Run Semgrep (SARIF for Security tab)
        run: semgrep scan --config .semgrep.yml --config p/default --config p/owasp-top-ten --sarif --output semgrep-results.sarif
        continue-on-error: true

      - name: Upload to security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "semgrep-results.sarif"
          category: "semgrep"

      - name: Run Semgrep (enforce failure, gates the PR)
        run: semgrep scan --config .semgrep.yml --config p/default --config p/owasp-top-ten --error --severity ERROR

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [semgrep]
    if: always()
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.semgrep.result != 'failure' && 'success' || 'failure' }}
          title: "Semgrep SAST"
          description: |
            **Commit:** ${{ github.event.pull_request.title || 'Nightly Run' }}
            **Triggered by:** ${{ github.actor }}
            **Branch:** ${{ github.head_ref || github.ref_name }}
            **Repository:** ${{ github.repository }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
