name: Checkov

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
    paths:
      - "**.tf"
      - "infra/**"
      - "cloudformation/**"
  schedule:
    - cron: "0 0 * * 5" # Run on Fridays

permissions:
  security-events: write
  contents: read

jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Run Checkov (SARIF for Security tab)
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload to security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "checkov-results.sarif"
          category: "checkov"

      - name: Run Checkov (enforce failure, gates infra changes)
        uses: bridgecrewio/checkov-action@v12
        with:
          output_format: cli
          soft_fail: false

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [checkov]
    if: always()
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.checkov.result != 'failure' && 'success' || 'failure' }}
          title: "Checkov Config Scan"
          description: |
            **Commit:** ${{ github.event.pull_request.title || 'Nightly Run' }}
            **Triggered by:** ${{ github.actor }}
            **Branch:** ${{ github.head_ref || github.ref_name }}
            **Repository:** ${{ github.repository }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
