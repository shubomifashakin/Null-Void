title = "gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Global allowlist"
paths = [
  '''.*\.lock$''',
  '''.*\.md$''',
  '''(.*/)?\.gitleaks\.toml$''',
  '''(.*/)?test(s)?/.*''',
]

# Add per-project rule exceptions below as they come up, e.g.:
