name: Scan Production image

on:
  schedule:
    - cron: "0 0 * * 5"
  workflow_dispatch:

permissions:
  security-events: write

jobs:
  scan-server:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Scan latest server image
        run: |
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/null-void-server:latest

      - name: Scheduled Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/null-void-server:latest
          format: sarif
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          output: "server-image.sarif"

      - name: Upload to security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "server-image.sarif"
          category: "trivy-image-server"

  scan-processor:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Scan latest processor image
        run: |
          docker pull ${{ vars.DOCKERHUB_USERNAME }}/null-void-processor:latest

      - name: Scheduled Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/null-void-processor:latest
          format: sarif
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          output: "processor-image.sarif"

      - name: Upload to security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "processor-image.sarif"
          category: "trivy-image-processor"

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [scan-processor, scan-server]
    if: always()
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.scan-server.result != 'failure' && needs.scan-processor.result != 'failure' && 'success' || 'failure' }}
          title: "Trivy Production Image Scan"
          description: |
            **Triggered by:** ${{ github.actor }}
            **Branch:** ${{ github.head_ref || github.ref_name }}
            **Repository:** ${{ github.repository }}
            url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
