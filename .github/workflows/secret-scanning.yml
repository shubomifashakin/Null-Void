name: Secret Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight

permissions:
  security-events: write
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks (report — uploads artifact to Security tab)
        uses: gitleaks/gitleaks-action@v3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
          GITLEAKS_VERSION: 8.30.1

      - name: Run Gitleaks (enforce failure)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_VERSION: 8.30.1

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [gitleaks]
    if: always()
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.gitleaks.result != 'failure' && 'success' || 'failure' }}
          title: "Gitleaks Secret Scan"
          description: |
            **Commit:** ${{ github.event.pull_request.title || 'Nightly Run' }}
            **Triggered by:** ${{ github.actor }}
            **Branch:** ${{ github.head_ref || github.ref_name }}
            **Repository:** ${{ github.repository }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
