name: Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/processor/**"
      - "apps/server/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"
      - "ops/**"
  workflow_dispatch:

jobs:
  build:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Processor Image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: apps/processor/Dockerfile
          push: false
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/null-void-processor:${{ github.sha }}, ${{ vars.DOCKERHUB_USERNAME }}/null-void-processor:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/null-void-processor:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/null-void-processor:buildcache,mode=max,push=true

      - name: Build migration image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: apps/server/Dockerfile.migrate
          push: false
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/null-void-migrate:${{ github.sha }}, ${{ vars.DOCKERHUB_USERNAME }}/null-void-migrate:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/null-void-migrate:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/null-void-migrate:buildcache,mode=max,push=true

      - name: Build Server Image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: apps/server/Dockerfile.app
          push: false
          load: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/null-void-server:${{ github.sha }}, ${{ vars.DOCKERHUB_USERNAME }}/null-void-server:latest
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/null-void-server:buildcache
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/null-void-server:buildcache,mode=max,push=true

      - name: Processor Image Scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: 1
          severity: "CRITICAL,HIGH"
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/null-void-processor:${{ github.sha }}
          scan-type: "image"
          ignore-unfixed: true
          format: table

      - name: Server Image Scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: 1
          severity: "CRITICAL,HIGH"
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/null-void-server:${{ github.sha }}
          scan-type: "image"
          ignore-unfixed: true
          format: table

      - name: Migration Image Scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          exit-code: 1
          severity: "CRITICAL,HIGH"
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/null-void-migrate:${{ github.sha }}
          scan-type: "image"
          ignore-unfixed: true
          format: table

      - name: Push Docker Images
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/null-void-processor:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/null-void-processor:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/null-void-server:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/null-void-server:latest
          docker push ${{ vars.DOCKERHUB_USERNAME }}/null-void-migrate:${{ github.sha }}
          docker push ${{ vars.DOCKERHUB_USERNAME }}/null-void-migrate:latest

  migrate:
    runs-on: ubuntu-latest
    needs: [build]
    environment: production
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Run Database Migrations
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOSTNAME }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,CURRENT_SHA,SERVER_DOPPLER_TOKEN
          script_path: ./scripts/actions/migrate.sh
        env:
          DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          CURRENT_SHA: ${{ github.sha }}
          SERVER_DOPPLER_TOKEN: ${{ secrets.SERVER_DOPPLER_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build, migrate]
    environment: production
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Backup current deployment on VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOSTNAME }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_path: ./scripts/actions/backup-ops.sh
          envs: REMOTE_USER
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}

      - name: Copy Ops Files to Server
        uses: Burnett01/rsync-deployments@v8
        with:
          path: ./ops/
          switches: -avr --exclude=".git/*" --exclude=".env*"
          remote_host: ${{ secrets.HOSTNAME }}
          remote_user: ${{ secrets.REMOTE_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
          remote_path: /home/${{ secrets.REMOTE_USER }}/projects/null-void/

      - name: Start new containers
        uses: appleboy/ssh-action@v1.2.5
        env:
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          CURRENT_SHA: ${{ github.sha }}
          SERVER_DOPPLER_TOKEN: ${{ secrets.SERVER_DOPPLER_TOKEN }}
          PROCESSOR_DOPPLER_TOKEN: ${{ secrets.PROCESSOR_DOPPLER_TOKEN }}
          DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        with:
          host: ${{ secrets.HOSTNAME }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REMOTE_USER,CURRENT_SHA,SERVER_DOPPLER_TOKEN,PROCESSOR_DOPPLER_TOKEN,DOCKER_USERNAME
          script_path: ./scripts/actions/deploy.sh

  notify:
    name: Notify Discord
    runs-on: ubuntu-latest
    needs: [build, migrate, deploy]
    if: always()
    steps:
      - name: Send Discord Notification
        uses: sarisia/actions-status-discord@v1.16.0
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ needs.build.result == 'success' && needs.migrate.result == 'success' && needs.deploy.result == 'success' && 'success' || 'failure' }}
          title: "Production Deployment"
          description: |
            **Commit:** ${{ github.event.head_commit.message }}
            **Triggered by:** ${{ github.actor }}
            **Branch:** ${{ github.ref_name }}
            **Repository:** ${{ github.repository }}
          url: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          username: GitHub Actions
          avatar_url: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png
